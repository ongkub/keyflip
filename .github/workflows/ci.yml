name: ci
on:
  push:
  pull_request:

jobs:
  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (model-parity tests skip without local models)
        run: cargo test --release

  mac-swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Swift bridge smoke test (fixture models)
        run: bash app/test.sh
      - name: Build macOS app (generic models optional in CI)
        run: bash app/build.sh

  python-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chat import tests (no models needed)
        working-directory: detector
        run: python -m unittest -q test_import

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows app and portable logic
        run: cargo test -p keyflip-win
      - name: Build Windows tray app
        run: cargo build --release -p keyflip-win
      - uses: actions/upload-artifact@v4
        with:
          name: keyflip-windows
          path: target/release/keyflip.exe
          if-no-files-found: error
