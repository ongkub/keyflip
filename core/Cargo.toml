[package]
name = "keyflip-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Detects and fixes words typed in the wrong keyboard layout (Thai Kedmanee <-> English)"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
