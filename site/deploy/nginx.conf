worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 256;
}

http {
    include mime.types;
    types {
        text/vtt vtt;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript text/vtt image/svg+xml application/json;
    sendfile on;
    server_tokens off;
    absolute_redirect off;
    disable_symlinks on;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt text/plain;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        client_max_body_size 1k;

        include /etc/nginx/security-headers.conf;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /__health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location = /404.html {
            internal;
        }

        location ~* \.(css|js|json)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        location ~* \.(woff2|png|jpg|jpeg|svg|ico|mp4|vtt)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
