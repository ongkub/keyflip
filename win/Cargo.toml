[package]
name = "keyflip-win"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "KeyFlip for Windows: tray app that fixes words typed in the wrong keyboard layout"

[[bin]]
name = "keyflip"
path = "src/main.rs"

[dependencies]
keyflip-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }
